<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d211f">
  <meta name="description" content="Дом: мобильный справочник по ремонту и строительству с пошаговыми инструкциями, узлами, ошибками и калькуляторами.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Дом">
  <title>Дом - справочник по ремонту и строительству</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#/home" aria-label="Домой">
        <span class="brand-mark" aria-hidden="true">Д</span>
        <span><strong>Дом</strong><small>ремонт без поискового квеста</small></span>
      </a>
      <button class="install-button" id="installButton" type="button" hidden>На экран</button>
    </header>

    <section class="search-shell" aria-label="Поиск по справочнику">
      <label class="search-box">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="globalSearch" type="search" placeholder="Что нужно сделать? Например: подрозетник в ГКЛ" autocomplete="off" enterkeyhint="search">
        <button id="clearSearch" class="clear-search" type="button" aria-label="Очистить поиск" hidden>×</button>
      </label>
    </section>

    <main id="app" class="app-content" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Основная навигация">
      <a href="#/home" data-nav="home"><span aria-hidden="true">⌂</span><small>Главная</small></a>
      <a href="#/search" data-nav="search"><span aria-hidden="true">⌕</span><small>Поиск</small></a>
      <a href="#/calculator" data-nav="calculator"><span aria-hidden="true">▦</span><small>Расчёт</small></a>
      <a href="#/saved" data-nav="saved"><span aria-hidden="true">★</span><small>Сохранено</small></a>
    </nav>
  </div>
  <noscript><p class="noscript">Для работы справочника нужен JavaScript.</p></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
